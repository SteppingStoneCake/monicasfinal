<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio moodboard | Monica Privett</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e6d3c9;color:#302624;font-family:Georgia,serif;min-height:100vh;display:grid;place-items:center;padding:20px}.frame{background:#fffaf3;width:min(100%,720px);padding:clamp(22px,6vw,48px);border:1px solid #ba9f93;box-shadow:12px 12px 0 #9a776e}.eyebrow{font:700 11px/1.4 Arial,sans-serif;letter-spacing:.2em;color:#94675f;text-transform:uppercase}h1{font-size:clamp(32px,7vw,62px);font-weight:400;line-height:1;margin:15px 0 30px}em{color:#a56c70}.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.note{min-height:115px;padding:14px;background:#e7d6ce;border-bottom:3px solid #ba8f86}.note:nth-child(2){background:#d8dfd4;border-color:#8eac98}.note:nth-child(3){background:#e9dfc5;border-color:#bc9e61}.note strong{display:block;font-size:20px;font-weight:400;margin-bottom:8px}.note small{font:12px/1.4 Arial,sans-serif}p{font:13px/1.5 Arial,sans-serif;margin:20px 0 0}@media(max-width:480px){.notes{grid-template-columns:1fr}.note{min-height:75px}}</style></head>
