<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Orleans postcard</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#173e36;font-family:Georgia,serif}.postcard{width:min(100%,660px);min-height:275px;background:#f5e8cf;padding:clamp(22px,5vw,42px);position:relative;box-shadow:12px 12px 0 #ae754f;color:#153d36}.postcard:before{content:"NOLA";position:absolute;right:24px;top:22px;border:2px solid #bc7656;color:#ac644d;border-radius:50%;width:54px;height:54px;display:grid;place-items:center;font:700 11px Arial;transform:rotate(-18deg)}.kicker{font:700 10px Arial;letter-spacing:.25em;text-transform:uppercase;color:#b26d52}h1{font-size:clamp(31px,6vw,54px);font-weight:400;line-height:1.04;margin:30px 0 22px}em{color:#a65e48}.line{border-top:1px solid #cdbba1;padding-top:13px;font:12px Arial;color:#665e4f}</style></head><body><div class="postcard"><span class="kicker">Postcard from the Crescent City</span><h1>Follow the music.<br><em>Stay for the stories.</em></h1><div class="line">A little note from my dream New Orleans itinerary.</div></div></body></html>
